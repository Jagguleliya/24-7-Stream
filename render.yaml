services:
  - type: web
    name: gta6-24-7-stream
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: PREVIEW_MODE
        value: "false"
      - key: FORCE_ENCODER
        value: "libx264"
      - key: YOUTUBE_STREAM_KEY
        sync: false
      - key: KICK_STREAM_KEY
        sync: false
